<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Add imagery from a Web Map Service (WMS) server." />
    <meta name="cesium-sandcastle-labels" content="Beginner" />
    <title>Cesium Demo</title>
    <script type="text/javascript" src="../Sandcastle-header.js"></script>
    <script
      type="text/javascript"
      src="../../../Build/CesiumUnminified/Cesium.js"
      nomodule

    <script type="module" src="../load-cesium-es6.js"></script>
  </head>
  <body class="sandcastle-loading" data-sandcastle-bucket="bucket-requirejs.html">
    <style>
      @import url(../templates/bucket.css);
    </style>
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbar"></div>
    <script id="cesium_sandcastle_script">
      window.startup = async function (Cesium) {
        "use strict";
        //Sandcastle_Begin
        console.log('yo v2')
        const viewer = new Cesium.Viewer("cesiumContainer", {
          baseLayerPicker: false,
          timeline: true, 
        });

        // try {
          const geeMetadata = await Cesium.GoogleEarthEnterpriseMetadata.fromUrl(
            new Cesium.Resource({
              url: "https://kh.google.com"
            }),
          );

          // viewer.scene.terrainProvider =
          //   Cesium.GoogleEarthEnterpriseTerrainProvider.fromMetadata(geeMetadata);

          const geeImageryProvider = new Cesium.GoogleEarthEnterpriseImageryProvider.fromMetadata(geeMetadata)
          const geeImageryLayer = new Cesium.ImageryLayer( geeImageryProvider );

          const imageryLayers = viewer.scene.imageryLayers;
          imageryLayers.add(geeImageryLayer);
          
          // Manually add timeline sync functionnality, could be embedded in the provider directly
          viewer.clock.onTick.addEventListener((clock) => {
            const date = Cesium.JulianDate.toDate(clock.currentTime);
            const geeDateHex = Cesium.GoogleEarthEnterpriseImageryProvider.encodeGeeDate(date)
            if (geeDateHex !== geeImageryProvider.geeDate){
              geeImageryProvider.geeDate = geeDateHex
            }

            // geeImageryLayer._layer.reload(); // internal reload call to refresh tiles
          });

        // } catch (error) {
        //   console.log(`Failed to create Google Earth providers from metadata. Confirm GEE service is correctly configured.
        //   ${error}`);
        // }

        // Start off looking at San Francisco.
        // viewer.camera.setView({
        //   destination: Cesium.Rectangle.fromDegrees(-123.0, 36.0, -121.7, 39.0),
        // }); 
        // Start off looking at Nanterre.
        viewer.camera.setView({
          destination: Cesium.Rectangle.fromDegrees(2.21005777, 48.90299514, 2.24150486, 48.88909253,),
        });

        
        const startTime = Cesium.JulianDate.fromIso8601("2005-01-01T00:00:00Z")
        const stopTime = Cesium.JulianDate.fromIso8601("2025-01-01T00:00:00Z")
        viewer.timeline.zoomTo(startTime, stopTime)

        // Other clock def
        // const clock = new Cesium.Clock({
        //   startTime,
        //   stopTime,
        //   currentTime: stopTime,
        //   clockRange: Cesium.ClockRange.LOOP_STOP,
        //   clockStep: Cesium.ClockStep.SYSTEM_CLOCK_MULTIPLIER,
        //   multiplier: 31557600, // seconds in a year
        // });
        // setTimeout(() => {
        //   viewer.timeline = new Cesium.Timeline('cesium-viewer-animationContainer', clock)
        // }, 5000)
        
        //Sandcastle_End
      };
      if (typeof Cesium !== "undefined") {
        window.startupCalled = true;
        window.startup(Cesium).catch((error) => {
          "use strict";
          console.error(error);
        });
        Sandcastle.finishedLoading();
      }
    </script>
  </body>
</html>
